<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Kumpas</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body class="reset-password-page">
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-form-container">
                <div class="auth-header">
                    <h1>Reset Your Password</h1>
                    <p>Enter the code from your email and choose a new password.</p>
                </div>
                <form id="resetPasswordForm" class="auth-form">
                    <div class="form-group">
                        <label for="resetEmail" class="form-label">Email Address</label>
                        <input type="email" id="resetEmail" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label for="resetCode" class="form-label">Reset Code</label>
                        <input type="text" id="resetCode" class="form-input" maxlength="6" required>
                    </div>
                    <div class="form-group password-field">
                        <label for="newPassword" class="form-label">New Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="newPassword" class="form-input" required>
                            <button type="button" class="password-toggle" aria-label="Show password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group password-field">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="confirmPassword" class="form-input" required>
                            <button type="button" class="password-toggle" aria-label="Show password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Reset Password</button>
                </form>
                <div class="auth-footer" style="margin-top:16px; display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap;">
                    <button id="resendResetBtn" class="btn btn-secondary" type="button" style="flex: 1 1 auto; min-width: 160px;">Resend Code</button>
                    <a href="login.html" style="flex: 1 1 auto; min-width: 120px; text-align:right;">Back to Login</a>
                </div>
                <div id="resetMessage" class="form-message"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'https://kumpass.onrender.com/api';
        document.addEventListener('DOMContentLoaded', function () {
            const resetForm = document.getElementById('resetPasswordForm');
            const resetEmail = document.getElementById('resetEmail');
            const resetCode = document.getElementById('resetCode');
            const newPassword = document.getElementById('newPassword');
            const confirmPassword = document.getElementById('confirmPassword');
            const resendResetBtn = document.getElementById('resendResetBtn');
            const msg = document.getElementById('resetMessage');

            function setButtonLoading(button, text) {
                const originalHtml = button.innerHTML;
                button.disabled = true;
                button.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${text}`;
                return () => {
                    button.disabled = false;
                    button.innerHTML = originalHtml;
                };
            }

            async function postJson(path, payload) {
                const res = await fetch(`${API_BASE}${path}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'omit',
                    body: JSON.stringify(payload),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || data.details || data.message || 'Request failed');
                return data;
            }

            const qs = new URLSearchParams(window.location.search);
            const emailFromQuery = (qs.get('email') || '').trim().toLowerCase();
            if (emailFromQuery) {
                resetEmail.value = emailFromQuery;
            }

            resetForm.addEventListener('submit', async function (e) {
                e.preventDefault();
                msg.style.color = '#b91c1c';
                msg.textContent = '';

                const email = (resetEmail.value || '').trim().toLowerCase();
                const otp = (resetCode.value || '').trim();
                const password = (newPassword.value || '').trim();
                const confirm = (confirmPassword.value || '').trim();

                if (!email || !otp || !password || !confirm) {
                    msg.textContent = 'Please complete all fields.';
                    return;
                }
                if (password.length < 8) {
                    msg.textContent = 'Password must be at least 8 characters long.';
                    return;
                }
                if (password !== confirm) {
                    msg.textContent = 'Passwords do not match.';
                    return;
                }

                        const restore = setButtonLoading(resetForm.querySelector('button[type=submit]'), 'Resetting...');
                try {
                    const data = await postJson('/auth/reset-password/', {
                        email,
                        otp,
                        newPassword: password,
                        confirmPassword: confirm,
                    });
                    msg.style.color = '#059669';
                    msg.textContent = data.message || 'Password reset successful. Redirecting to login...';
                    setTimeout(() => window.location.replace('login.html'), 1000);
                } catch (err) {
                    let message = err.message || 'Password reset failed.';
                    if (err.data && err.data.details) {
                        message += ' ' + err.data.details;
                    }
                    msg.textContent = message;
                } finally {
                    restore();
                }
            });

            resendResetBtn.addEventListener('click', async function () {
                if (resendResetBtn.disabled) return;
                msg.style.color = '#b91c1c';
                msg.textContent = '';
                const email = (resetEmail.value || '').trim().toLowerCase();
                if (!email) {
                    msg.textContent = 'Please provide your email first.';
                    return;
                }
                const restore = setButtonLoading(resendResetBtn, 'Resending...');
                try {
                    const data = await postJson('/auth/resend-password-reset-code/', { email });
                    msg.style.color = '#059669';
                    msg.textContent = data.message || 'Reset code resent. Check your email.';
                } catch (err) {
                    msg.textContent = err.message || 'Unable to resend reset code.';
                } finally {
                    restore();
                }
            });

            document.querySelectorAll('.password-toggle').forEach(toggle => {
                toggle.addEventListener('click', function () {
                    const fieldContainer = this.closest('.password-field');
                    if (!fieldContainer) return;
                    const input = fieldContainer.querySelector('.form-input');
                    if (!input) return;
                    const isPassword = input.type === 'password';
                    input.type = isPassword ? 'text' : 'password';
                    const icon = this.querySelector('i');
                    if (icon) {
                        icon.classList.toggle('fa-eye');
                        icon.classList.toggle('fa-eye-slash');
                    }
                });
            });
        });
    </script>
</body>
</html>
