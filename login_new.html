<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Login - Kumpas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #4169e1, #7c3aed);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-box h2 {
            color: #4169e1;
            margin-bottom: 30px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4169e1;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #4169e1;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn:hover {
            background: #3151b1;
        }
        .links {
            text-align: center;
            margin-top: 20px;
        }
        .links a {
            color: #4169e1;
            text-decoration: none;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>👋 Login to Kumpas</h2>
        <form onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label>Email or Username</label>
                <input type="text" id="username" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="btn">Login</button>
        </form>
        <div class="links">
            <p>Don't have an account? <a href="register.html">Register here</a></p>
            <p><a href="index.html">Back to Home</a></p>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            
            var username = document.getElementById('username').value;
            var password = document.getElementById('password').value;
            
            // Simple validation
            if (username === '' || password === '') {
                alert('Please fill in all fields!');
                return false;
            }
            
            // Temporary login - just redirect to dashboard
            // In real app, this would check database
            alert('Login successful! Welcome to Kumpas!');
            window.location.href = 'dashboard.html';
            
            return false;
        }
    </script>
</body>
</html>
