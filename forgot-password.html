<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Kumpas</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body class="forgot-password-page">
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-form-container">
                <div class="auth-header">
                    <h1>Forgot Password</h1>
                    <p>Enter your email address to receive a password reset code.</p>
                </div>
                <form id="forgotPasswordForm" class="auth-form">
                    <div class="form-group">
                        <label for="forgotEmail" class="form-label">Email Address</label>
                        <input type="email" id="forgotEmail" class="form-input" placeholder="you@example.com" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Send Reset Code</button>
                </form>
                <div class="auth-footer">
                    <p>Remembered your password? <a href="login.html">Sign In</a></p>
                </div>
                <div id="forgotMessage" class="form-message"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000/api';
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('forgotPasswordForm');
            const emailInput = document.getElementById('forgotEmail');
            const msg = document.getElementById('forgotMessage');

            async function postJson(path, payload) {
                const res = await fetch(`${API_BASE}${path}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'omit',
                    body: JSON.stringify(payload),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || data.details || data.message || 'Request failed');
                return data;
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                msg.style.color = '#b91c1c';
                msg.textContent = '';

                const email = (emailInput.value || '').trim().toLowerCase();
                if (!email) {
                    msg.textContent = 'Please enter your email address.';
                    return;
                }

                try {
                    const data = await postJson('/auth/request-password-reset/', { email });
                    msg.style.color = '#059669';
                    msg.textContent = data.message || 'Reset code sent. Check your email.';
                    setTimeout(() => {
                        window.location.replace(data.redirect || `reset-password.html?email=${encodeURIComponent(email)}`);
                    }, 900);
                } catch (err) {
                    msg.textContent = err.message || 'Unable to send reset code';
                }
            });
        });
    </script>
</body>
</html>
