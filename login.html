<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kumpas</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <!-- Sidebar -->
            <div class="auth-sidebar">
                <div class="logo">
                    <span>Kumpas</span>
                </div>
                <h2>Welcome Back!</h2>
                <p>Continue your Filipino Sign Language learning journey. Log in to access your personalized dashboard, track your progress, and unlock new activities.</p>
                <div class="auth-illustration">
                    <i class="fas fa-hand-peace"></i>
                </div>
            </div>

            <!-- Login Form -->
            <div class="auth-form-container">
                <div class="auth-header">
                    <h1>Sign In</h1>
                    <p>Enter your credentials to access your account</p>
                </div>

                <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" id="email" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label for="role" class="form-label">Select Role</label>
                        <select id="role" class="form-input" required>
                            <option value="" selected>Choose your role...</option>
                            <option value="student">Student</option>
                            <option value="instructor">Instructor</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <div class="form-group" id="securityPinGroup" style="display: none;">
                        <label for="securityPin" class="form-label">Security PIN</label>
                        <input type="password" id="securityPin" class="form-input" inputmode="numeric" maxlength="6">
                    </div>

                    <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                        <div class="checkbox-group">
                            <input type="checkbox" id="remember">
                            <label for="remember">Remember me</label>
                        </div>
                        <div class="forgot-password">
                            <a href="forgot-password.html">Forgot Password?</a>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="register.html">Sign Up</a></p>
                    <p style="margin-top: 1rem;"><a href="index.html">← Back to Home</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
