<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Kumpas</title>
    <link rel="icon" type="image/png" href="images/logo_transparent.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body class="login-page">
    <div class="auth-page">
        <div class="auth-container">
            <!-- Sidebar -->
            <div class="auth-sidebar">
                <div class="logo auth-brand">
                    <img src="images/logo_transparent.png" alt="Kumpas logo" class="auth-brand-logo">
                </div>
                <h2>Welcome Back!</h2>
                <p>Sign in to continue your journey with KUMPAS sign language learning platform</p>
                <div class="auth-illustration">
                    <i class="fas fa-hand-peace"></i>
                </div>
            </div>

            <!-- Login Form -->
            <div class="auth-form-container">
                <div class="auth-header">
                    <h1>Login to KUMPAS</h1>
                    <p>Enter your credentials to access your account</p>
                </div>

                <div class="google-signin-container" id="googleSignInContainer"></div>
                <div class="divider"><span>OR</span></div>

                <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label for="email" class="form-label">Email / Username</label>
                        <input type="text" id="email" class="form-input" placeholder="Enter email or username" required>
                    </div>

                    <div class="form-group password-field">
                        <label for="password" class="form-label">Password</label>
                        <div class="password-input-wrapper">
                            <input type="password" id="password" class="form-input" required>
                            <button type="button" class="password-toggle" placeholder="Enter a password" aria-label="Show password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                        <div class="forgot-password">
                            <a href="forgot-password.html">Forgot Password?</a>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width: 100%;">
                         Sign In <i class="fas fa-sign-in-alt"></i>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="register.html">Sign Up</a></p>
                    <p style="margin-top: 1rem;"><a href="index.html">← Back to Home</a></p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="js/google-config.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
