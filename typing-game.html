<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-to-Word Typing Game - Kumpas</title>
    <link rel="stylesheet" href="css/style.css?v=20260801">
    <link rel="stylesheet" href="css/dashboard.css?v=20260801">
    <link rel="stylesheet" href="css/bg-orbs.css?v=20260801">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="js/theme.js?v=20260801"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #eff6ff;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h1, h2, h3 {
            font-family: 'Poppins', 'Inter', sans-serif;
        }


        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            padding: clamp(0.75rem, 2vw, 1.25rem) clamp(1rem, 3vw, 1.5rem);
        }

        /* Fills the remaining viewport height below the navbar */
        .game-shell {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            gap: 14px;
        }

        /* Top Bar: title, level, difficulty, score */
        .game-topbar {
            flex: 0 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px 24px;
            background: rgba(255,255,255,0.95);
            border-radius: 18px;
            padding: 12px 20px;
            box-shadow: 0 10px 24px rgba(15,23,42,0.08);
            border: 1px solid rgba(148,163,184,0.14);
        }

        .topbar-title-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .game-topbar h1 {
            font-size: clamp(1.05rem, 1.6vw + 0.7rem, 1.4rem);
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.02em;
        }

        .level-badge {
            font-size: 12px;
            font-weight: 700;
            color: #2563eb;
            background: #eef2ff;
            padding: 5px 12px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .topbar-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 20px;
        }

        /* Difficulty Selector */
        .difficulty-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 8px 14px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.25s;
        }

        .difficulty-btn:hover {
            border-color: #2563eb;
            color: #2563eb;
        }

        .difficulty-btn.selected {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 10px 20px rgba(37,99,235,0.24);
        }

        .difficulty-btn.locked,
        .difficulty-btn:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            border-color: #ccc;
            background: #f9f9f9;
            color: #777;
        }

        /* Score Section */
        .score-section {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .score-box {
            background: #f8fafc;
            border: 1px solid rgba(148,163,184,0.14);
            padding: 6px 14px;
            border-radius: 12px;
            text-align: center;
            min-width: 64px;
            transition: transform 0.2s ease;
        }

        .score-box:hover {
            transform: translateY(-2px);
        }

        .score-box .label {
            font-size: 10px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
        }

        .score-box .value {
            font-size: 17px;
            font-weight: bold;
            color: #2563eb;
        }

        /* Game Columns: choices on the left, video on the right */
        .game-columns {
            flex: 1;
            display: flex;
            gap: 20px;
            min-height: 0;
        }

        /* Left Panel: typing input + actions */
        .choices-panel {
            flex: 0 1 400px;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: rgba(255,255,255,0.95);
            border-radius: 22px;
            padding: 20px 22px;
            box-shadow: 0 14px 34px rgba(15,23,42,0.09);
            border: 1px solid rgba(148,163,184,0.14);
            animation: kdRiseIn 0.55s ease both;
        }

        .question {
            flex: 0 0 auto;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }

        #typing-input {
            flex: 0 0 auto;
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            font-size: 16px;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        #typing-input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
        }

        /* Feedback */
        .feedback {
            flex: 0 0 auto;
            padding: 10px 14px;
            border-radius: 14px;
            margin-top: 12px;
            font-weight: 600;
            text-align: center;
            display: none;
            font-size: 15px;
        }

        .feedback.show {
            display: block;
            animation: kdRiseIn 0.35s ease both;
        }

        .feedback.correct {
            background: #d1fae5;
            color: #065f46;
        }

        .feedback.incorrect {
            background: #fee2e2;
            color: #991b1b;
        }

        /* Submit / Exit, pinned to the bottom of the left panel */
        .panel-actions {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
            padding-top: 14px;
        }

        .panel-actions .btn {
            width: 100%;
            padding: 15px 20px;
            font-size: 15px;
        }

        /* Right Panel: sign video, large and vertically centered */
        .video-panel {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sign-display {
            width: 100%;
            height: 100%;
            padding: 8px;
            background: rgba(255,255,255,0.95);
            border-radius: 22px;
            box-shadow: 0 14px 34px rgba(15,23,42,0.09);
            border: 1px solid rgba(148,163,184,0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: kdRiseIn 0.55s ease both;
            animation-delay: .06s;
        }

        .sign-video {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 14px;
            background: #000;
            display: block;
            object-fit: contain;
            object-position: center center;
            box-shadow: 0 12px 28px rgba(15,23,42,0.14);
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 12px 26px;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: white;
            box-shadow: 0 10px 20px rgba(37,99,235,0.24);
        }

        .btn-primary:hover {
            box-shadow: 0 14px 26px rgba(37,99,235,0.32);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        .btn-back {
            background: #475569;
            color: white;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-back:hover {
            background: #334155;
        }

        @media (max-width: 1024px) {
            .choices-panel {
                flex-basis: 340px;
                padding: 16px 18px;
            }

            .game-columns {
                gap: 14px;
            }

            .sign-display {
                padding: 8px;
            }

            .game-topbar {
                padding: 10px 16px;
            }
        }

        @media (max-width: 768px) {
            html, body {
                height: auto;
            }

            body {
                overflow: visible;
            }

            .game-columns {
                flex-direction: column;
            }

            .video-panel {
                flex: 0 0 auto;
                min-height: 240px;
            }

            .choices-panel {
                flex-basis: auto;
                min-width: 0;
            }

            .topbar-controls {
                width: 100%;
                justify-content: space-between;
            }
        }

        @media (max-width: 420px) {
            .score-section {
                gap: 6px;
            }

            .score-box {
                min-width: 0;
                padding: 6px 10px;
            }
        }

        /* ---- Dark theme overrides ---- */
        :root[data-theme="dark"] body {
            background-color: var(--surface-page);
            color: var(--text-body);
        }

        :root[data-theme="dark"] .game-topbar,
        :root[data-theme="dark"] .choices-panel,
        :root[data-theme="dark"] .sign-display {
            background: var(--surface-card);
            border-color: var(--surface-border);
        }

        :root[data-theme="dark"] .game-topbar h1 {
            color: var(--text-body);
        }

        :root[data-theme="dark"] .level-badge {
            background: rgba(37,99,235,0.18);
            color: #93c5fd;
        }

        :root[data-theme="dark"] .difficulty-btn {
            border-color: var(--input-border);
            background: var(--input-bg);
            color: var(--text-body);
        }

        :root[data-theme="dark"] .difficulty-btn.locked,
        :root[data-theme="dark"] .difficulty-btn:disabled {
            border-color: var(--surface-border);
            background: var(--surface-card-alt);
            color: var(--text-muted);
        }

        :root[data-theme="dark"] .score-box {
            background: var(--surface-card-alt);
            border-color: var(--surface-border);
        }

        :root[data-theme="dark"] .score-box .label {
            color: var(--text-muted-2);
        }

        :root[data-theme="dark"] .question {
            color: var(--text-body);
        }

        :root[data-theme="dark"] #typing-input {
            background: var(--input-bg);
            border-color: var(--input-border);
            color: var(--text-body);
        }

        :root[data-theme="dark"] .feedback.correct {
            background: rgba(6,95,70,0.35);
            color: #6ee7b7;
        }

        :root[data-theme="dark"] .feedback.incorrect {
            background: rgba(153,27,27,0.35);
            color: #fca5a5;
        }

        :root[data-theme="dark"] .btn-secondary {
            background: var(--surface-card-alt);
            color: var(--text-body);
        }

        :root[data-theme="dark"] .btn-secondary:hover {
            background: var(--surface-border);
        }

        /* ============ SIDEBAR NAV (fits into the no-scroll game shell) ============ */
        .dashboard-layout {
            flex: 1;
            min-height: 0;
        }

        .dashboard-main {
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 0;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .dashboard-main {
                overflow: visible;
            }
        }

        /* ============ COMPACT NAVBAR ============ */
        .navbar {
            padding: 8px 22px !important;
            min-height: 52px !important;
        }

        /* ============ SIDEBAR LOGO ============ */
        .sidebar-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
        }

        .sidebar-logo-badge {
            width: 160px;
            height: 104px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 26px;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            box-shadow: 0 14px 28px rgba(37,99,235,0.32);
        }

        .sidebar-logo {
            width: 150px;
            height: 76px;
            object-fit: contain;
        }
    </style>
</head>

    <script>
        function awardGameProgress(points, progressDelta, completed) {
            if (window.KumpasGamePreview && window.KumpasGamePreview.active) return;
            if (!window.KumpasPortal || typeof window.KumpasPortal.recordProgress !== 'function') return;
            window.KumpasPortal.recordProgress({
                moduleId: 'lesson3',
                points,
                progressDelta,
                completed,
                practiceMinutes: 2,
                activityName: 'Typing Game',
                activityText: 'Completed a typing round',
                activityMeta: `+${points} points`,
                icon: '⌨️'
            });
        }

        const { videoMimeType } = KumpasGames;
        const HARD_TIME_LIMIT_SECONDS = 15;

        // Typing has no multiple-choice options, so choiceCounts isn't used for
        // rendering; kept for API symmetry with the other games' engine config.
        const engine = KumpasGames.createGameEngine({
            choiceCounts: { easy: 0, medium: 0, hard: 0 },
            pointBase: { easy: 8, medium: 10, hard: 12 },
        });

        let activeQuestions = [];
        let currentIndex = 0;
        let answered = false;
        let countdown = null;
        let advanceTimer = null;

        function updateLevelTag() {
            const levelTag = document.getElementById('randomLevelTag');
            const ofTotal = document.getElementById('levelOfTotal');
            if (levelTag) levelTag.textContent = `Level ${engine.currentLevelNumber()}`;
            if (ofTotal) {
                const totalLevels = engine.totalLevelsForDifficulty(engine.state.difficulty);
                ofTotal.textContent = totalLevels ? `of ${totalLevels}` : '';
            }
            const progressBadge = document.getElementById('questionProgressBadge');
            if (progressBadge) {
                progressBadge.textContent = activeQuestions.length
                    ? `Question ${Math.min(currentIndex + 1, activeQuestions.length)} of ${activeQuestions.length}`
                    : '';
            }
        }

        function setDifficulty(level, button) {
            if (!engine.canSelectDifficulty(level)) {
                alert('Please finish the previous difficulty before continuing.');
                return;
            }
            engine.setDifficulty(level, true);
            startLevel();
        }

        function normalizeInput(value) {
            return String(value == null ? '' : value)
                .toLowerCase()
                .replace(/[^a-z0-9\s]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function sanitizeTypingInput(value) {
            return String(value == null ? '' : value)
                .replace(/[^a-z0-9\s]/gi, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function validateTypingAnswer(value) {
            const sanitized = sanitizeTypingInput(value);
            if (!sanitized) return null;
            return normalizeInput(sanitized);
        }

        function handleTypingInput(event) {
            const input = event.target;
            const cleaned = String(input.value == null ? '' : input.value)
                .replace(/[^a-z0-9\s]/gi, '')
                .replace(/\s+/g, ' ')
                .trimStart();

            if (cleaned !== input.value) {
                input.value = cleaned;
            }
        }

        function startLevel(resetScore = false) {
            if (advanceTimer) {
                clearTimeout(advanceTimer);
                advanceTimer = null;
            }
            if (resetScore) {
                engine.state.score = 0;
                engine.state.correct = 0;
            }
            currentIndex = 0;
            activeQuestions = engine.buildQuestionsForCurrentLevel();
            engine.state.total = activeQuestions.length;
            engine.updateDifficultyButtons();
            updateScores();
            nextQuestion();
        }

        function nextQuestion() {
            if (currentIndex >= activeQuestions.length) {
                const result = engine.advance();
                if (result === 'next-level') {
                    startLevel(false);
                } else if (result === 'next-difficulty') {
                    const nextDifficulty = engine.state.difficulty === 'easy' ? 'medium' : 'hard';
                    KumpasGames.showCompletionModal({
                        title: '🎉 Difficulty Complete!',
                        message: `You finished all levels on ${engine.state.difficulty}. Moving on to ${nextDifficulty}.`,
                        continueLabel: `Starting ${nextDifficulty[0].toUpperCase()}${nextDifficulty.slice(1)}...`,
                        autoContinueAfterMs: 1400,
                        onContinue: () => {
                            engine.setDifficulty(nextDifficulty, false);
                            startLevel(false);
                        },
                    });
                } else {
                    KumpasGames.awardCertificateIfEarned('typing');
                    KumpasGames.showCompletionModal({
                        title: '🏆 Game Complete!',
                        message: 'You completed every difficulty. Restarting at Easy so you can play again.',
                        continueLabel: 'Play Again',
                        onContinue: () => {
                            engine.setDifficulty('easy', true);
                            startLevel(false);
                        },
                    });
                }
                return;
            }

            updateLevelTag();

            const question = activeQuestions[currentIndex];
            KumpasGames.replaceVideoContent(document.getElementById('sign'), question.video);
            const inputField = document.getElementById('typing-input');
            if (inputField) {
                inputField.value = '';
                inputField.disabled = false;
                inputField.focus();
                inputField.removeEventListener('input', handleTypingInput);
                inputField.addEventListener('input', handleTypingInput);
            }

            answered = false;
            clearFeedback();
            startTimerIfHard();
        }

        function startTimerIfHard() {
            const timeBox = document.getElementById('timeBox');
            if (countdown) countdown.stop();
            if (engine.state.difficulty !== 'hard') {
                if (timeBox) timeBox.style.display = 'none';
                return;
            }
            if (timeBox) timeBox.style.display = '';
            countdown = KumpasGames.createCountdown(
                HARD_TIME_LIMIT_SECONDS,
                secondsLeft => {
                    document.getElementById('time').textContent = secondsLeft + 's';
                },
                () => {
                    if (!answered) submitAnswer(true);
                }
            );
            countdown.start();
        }

        function submitAnswer(timedOut = false) {
            if (answered) return;

            const question = activeQuestions[currentIndex];
            const rawAnswer = document.getElementById('typing-input').value;
            const answer = timedOut ? null : validateTypingAnswer(rawAnswer);
            const feedbackDiv = document.getElementById('feedback');

            answered = true;
            if (countdown) countdown.stop();
            const inputField = document.getElementById('typing-input');
            if (inputField) inputField.disabled = true;

            const acceptedAnswers = question.answers.map(normalizeInput);
            const isCorrect = answer !== null && acceptedAnswers.includes(answer);

            if (isCorrect) {
                const points = engine.getPointValue();
                engine.state.correct++;
                engine.state.score += points;
                feedbackDiv.classList.remove('incorrect');
                feedbackDiv.classList.add('correct', 'show');
                feedbackDiv.textContent = '✓ Correct! Great typing!';
                awardGameProgress(points, 10, currentIndex + 1 >= activeQuestions.length && !engine.hasNextLevel());
            } else {
                feedbackDiv.classList.remove('correct');
                feedbackDiv.classList.add('incorrect', 'show');
                feedbackDiv.textContent = timedOut
                    ? `⏱ Time's up! The correct answer is: ${question.answers[0]}`
                    : `✗ Incorrect. The correct answer is: ${question.answers[0]}`;
            }

            updateScores();
            if (advanceTimer) clearTimeout(advanceTimer);
            advanceTimer = setTimeout(() => {
                advanceTimer = null;
                currentIndex++;
                nextQuestion();
            }, 900);
        }

        function updateScores() {
            document.getElementById('score').textContent = engine.state.score;
            document.getElementById('correct').textContent = engine.state.correct;
        }

        function clearFeedback() {
            const feedbackDiv = document.getElementById('feedback');
            feedbackDiv.classList.remove('show', 'correct', 'incorrect');
        }

        function getActivePool() { return engine.getActivePool(); }
        function canSelectDifficulty(level) { return engine.canSelectDifficulty(level); }
        function switchDifficulty(level, resetScore = true) {
            engine.setDifficulty(level, resetScore);
            startLevel(false);
        }

        // Submit on Enter key
        document.addEventListener('DOMContentLoaded', () => {
            const inputField = document.getElementById('typing-input');
            if (inputField) {
                inputField.addEventListener('keydown', e => {
                    if (e.key === 'Enter') submitAnswer();
                });
            }
        });

        // Initialize game
        KumpasGames.loadGameLevels('typing')
            .then(levels => {
                engine.state.levelsByDifficulty = KumpasGames.buildLevelsByDifficulty(
                    levels,
                    item => (item.media_url && item.prompt)
                        ? { video: item.media_url, answers: [String(item.prompt || '').toLowerCase()] }
                        : null
                );
                const levelCounts = {
                    easy: engine.totalLevelsForDifficulty('easy') || 0,
                    medium: engine.totalLevelsForDifficulty('medium') || 0,
                    hard: engine.totalLevelsForDifficulty('hard') || 0,
                };
                KumpasGames.initInstructionsModal({
                    title: 'Sign-to-Word Typing Game',
                    icon: '⌨️',
                    objective: 'Watch a sign-language video and type the word it represents.',
                    howToPlay: [
                        'A sign-language video plays for each question.',
                        'Type the matching word into the text box and submit (or press Enter).',
                        `On Hard difficulty, you have ${HARD_TIME_LIMIT_SECONDS} seconds to answer each question before time runs out.`,
                    ],
                    scoring: [
                        'Correct answers earn points based on your difficulty and current level.',
                        'Harder difficulties and higher levels are worth more points.',
                    ],
                    levelCounts,
                    onStart: () => startLevel(true),
                });
            })
            .catch(err => {
                console.error('Failed to load game levels:', err);
                document.getElementById('sign').innerHTML = '<p style="color:#991b1b;">Unable to load game levels. Please refresh the page.</p>';
            });
    </script>
</body>
</html>
