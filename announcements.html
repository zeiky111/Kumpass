<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements - Kumpas</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/bg-orbs.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="js/theme.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #eff6ff;
            color: #1f2937;
        }

        h1, h2, h3 {
            font-family: 'Poppins', 'Inter', sans-serif;
        }

        /* Page Header */
        .page-header {
            position: relative;
            overflow: hidden;
            isolation: isolate;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 55%, #7c3aed 130%);
            color: white;
            padding: 46px 20px;
            text-align: center;
            margin-bottom: 40px;
        }

        .page-header::before,
        .page-header::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            z-index: -1;
        }

        .page-header::before {
            width: 300px;
            height: 300px;
            top: -150px;
            right: 8%;
            background: rgba(255,255,255,0.12);
        }

        .page-header::after {
            width: 200px;
            height: 200px;
            bottom: -120px;
            left: 12%;
            background: rgba(236,72,153,0.22);
            filter: blur(4px);
        }

        .header-content h1 {
            font-size: clamp(1.35rem, 2.2vw + 1rem, 2rem);
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -0.02em;
        }

        .header-content p {
            font-size: 16px;
            opacity: 0.9;
        }

        /* Main Container */
        .announcements-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px 40px;
        }

        .announcements-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .announcement-item {
            background: white;
            box-shadow: 0 12px 28px rgba(15,23,42,0.08);
            animation: kdRiseIn 0.5s ease both;
        }

        .announcements-empty,
        .announcements-loading {
            background: white;
            border: 1px solid rgba(148,163,184,0.18);
            border-radius: 14px;
            padding: 30px;
            text-align: center;
            color: #64748b;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            .page-header {
                padding: 25px 15px;
            }

            .header-content p {
                font-size: 14px;
            }
        }

        /* ---- Dark theme overrides ---- */
        :root[data-theme="dark"] body {
            background-color: var(--surface-page);
            color: var(--text-body);
        }

        :root[data-theme="dark"] .announcement-item {
            background: var(--surface-card);
            border-color: var(--surface-border);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
        }

        :root[data-theme="dark"] .announcements-empty,
        :root[data-theme="dark"] .announcements-loading {
            background: var(--surface-card);
            border-color: var(--surface-border);
            color: var(--text-muted-2);
        }

        /* ============ COMPACT NAVBAR ============ */
        .navbar {
            padding: 8px 22px !important;
            min-height: 52px !important;
        }

        /* ============ SIDEBAR LOGO ============ */
        .sidebar-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
        }

        .sidebar-logo-badge {
            width: 160px;
            height: 104px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 26px;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            box-shadow: 0 14px 28px rgba(37,99,235,0.32);
        }

        .sidebar-logo {
            width: 150px;
            height: 76px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <script src="js/auth.js"></script>
    <script>
        requireAuth();
    </script>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container navbar-container">
            <a href="dashboard.html" class="logo">
                <span>Announcements</span>
            </a>
            <div class="nav-user-menu" id="navUserMenu">
                <button class="nav-user-toggle" id="navUserToggle">
                    <i class="fas fa-user-circle"></i>
                </button>
                <div class="nav-user-dropdown" id="navUserDropdown">
                    <a href="profile.html"><i class="fas fa-user"></i> Profile</a>
                    <a href="index.html" class="logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="dashboard-layout">
        <aside class="dashboard-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo-badge">
                    <img src="images/kumpas_logo.png" alt="Kumpas Logo" class="sidebar-logo">
                </div>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html" class="sidebar-link"><i class="fas fa-gauge"></i> Dashboard</a></li>
                <li><a href="learning.html" class="sidebar-link"><i class="fas fa-book-open"></i> Learn</a></li>
                <li><a href="activities.html" class="sidebar-link"><i class="fas fa-list-check"></i> Activities</a></li>
                <li><a href="translator.html" class="sidebar-link"><i class="fas fa-language"></i> Translators</a></li>
                <li><a href="leaderboard.html" class="sidebar-link"><i class="fas fa-trophy"></i> Leaderboard</a></li>
            </ul>
        </aside>
        <main class="dashboard-main">

    <!-- Page Header -->
    <section class="page-header">
        <div class="header-content">
            <h1><i class="fas fa-bell"></i> Announcements</h1>
            <p>Stay updated with the latest news from your instructors</p>
        </div>
    </section>

    <!-- Main Content -->
    <div class="announcements-container">
        <div id="announcementsList" class="announcements-list">
            <div class="announcements-loading">Loading announcements&hellip;</div>
        </div>
    </div>
        </main>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2026 Kumpas - Sign Language Learning System. City College of Calapan</p>
        </div>
    </footer>

    <script src="assets/js/main.js"></script>
    <script src="js/portal.js"></script>
    <script>
        // Navbar dropdown
        const _navToggle = document.getElementById('navUserToggle');
        const _navDrop = document.getElementById('navUserDropdown');
        if (_navToggle && _navDrop) {
            _navToggle.addEventListener('click', function(e) { e.stopPropagation(); _navDrop.classList.toggle('open'); });
            document.addEventListener('click', function() { _navDrop.classList.remove('open'); });
        }
    </script>
    <script>
        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatAnnouncementDate(value) {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '';
            return date.toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
        }

        function renderAnnouncementsList(announcements) {
            const target = document.getElementById('announcementsList');
            if (!target) return;

            if (!announcements || !announcements.length) {
                target.innerHTML = '<div class="announcements-empty">No announcements posted yet. Check back soon!</div>';
                return;
            }

            target.innerHTML = announcements.map(item => `
                <div class="announcement-item">
                    <h4><i class="fas fa-bullhorn" style="color:#2563eb;margin-right:8px;"></i>${escapeHtml(item.title || 'Announcement')}</h4>
                    <p>${escapeHtml(item.message || '')}</p>
                    <small>${escapeHtml(formatAnnouncementDate(item.updated_at || item.created_at))}</small>
                </div>
            `).join('');
        }

        (async function loadAnnouncements() {
            try {
                const portal = window.KumpasPortal;
                const announcements = portal && typeof portal.loadPublicAnnouncements === 'function'
                    ? await portal.loadPublicAnnouncements(20)
                    : [];
                renderAnnouncementsList(announcements);
            } catch (_) {
                renderAnnouncementsList([]);
            }
        })();
    </script>
</body>
</html>
