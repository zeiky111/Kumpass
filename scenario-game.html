<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scenario-Based Game - Kumpas</title>
    <link rel="stylesheet" href="css/style.css?v=20260801">
    <link rel="stylesheet" href="css/dashboard.css?v=20260801">
    <link rel="stylesheet" href="css/bg-orbs.css?v=20260801">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="js/theme.js?v=20260801"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #eff6ff;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h1, h2, h3 {
            font-family: 'Poppins', 'Inter', sans-serif;
        }


        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            padding: clamp(0.75rem, 2vw, 1.25rem) clamp(1rem, 3vw, 1.5rem);
        }

        /* Fills the remaining viewport height below the navbar */
        .game-shell {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            gap: 14px;
        }

        /* Top Bar: title, level, difficulty, score */
        .game-topbar {
            flex: 0 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px 24px;
            background: rgba(255,255,255,0.95);
            border-radius: 18px;
            padding: 12px 20px;
            box-shadow: 0 10px 24px rgba(15,23,42,0.08);
            border: 1px solid rgba(148,163,184,0.14);
        }

        .topbar-title-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .game-topbar h1 {
            font-size: clamp(1.05rem, 1.6vw + 0.7rem, 1.4rem);
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.02em;
        }

        .level-badge {
            font-size: 12px;
            font-weight: 700;
            color: #2563eb;
            background: #eef2ff;
            padding: 5px 12px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .topbar-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 20px;
        }

        /* Difficulty Selector */
        .difficulty-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 8px 14px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.25s;
        }

        .difficulty-btn:hover {
            border-color: #2563eb;
            color: #2563eb;
        }

        .difficulty-btn.selected {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 10px 20px rgba(37,99,235,0.24);
        }

        .difficulty-btn.locked,
        .difficulty-btn:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            border-color: #ccc;
            background: #f9f9f9;
            color: #777;
        }

        /* Score Section */
        .score-section {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .score-box {
            background: #f8fafc;
            border: 1px solid rgba(148,163,184,0.14);
            padding: 8px 12px;
            border-radius: 12px;
            text-align: center;
            transition: transform 0.2s ease;
        }

        .score-box:hover {
            transform: translateY(-2px);
        }

        .score-box .label {
            font-size: 11px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
        }

        .score-box .value {
            font-size: 21px;
            font-weight: bold;
            color: #2563eb;
        }

        /* Game Columns: scenario + actions on the left, sign-response videos on the right */
        .game-columns {
            flex: 1;
            display: flex;
            gap: 20px;
            min-height: 0;
        }

        /* Left Panel: scenario, question, feedback, actions */
        .choices-panel {
            flex: 0 1 460px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: rgba(255,255,255,0.95);
            border-radius: 22px;
            padding: 20px 22px;
            box-shadow: 0 14px 34px rgba(15,23,42,0.09);
            border: 1px solid rgba(148,163,184,0.14);
            animation: kdRiseIn 0.55s ease both;
        }

        /* Scrolls internally as a fallback only; keeps Submit/Exit pinned below */
        .choices-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-right: 2px;
        }

        .scenario-box {
            flex: 0 0 auto;
            background: linear-gradient(135deg, #eff6ff 0%, #ede9fe 100%);
            border-left: 4px solid #2563eb;
            padding: 16px 18px;
            border-radius: 14px;
            text-align: center;
        }

        .scenario-box strong {
            display: block;
            margin-bottom: 5px;
            color: #2563eb;
        }

        .scenario-text {
            font-size: 17px;
            color: #333;
            font-weight: 600;
        }

        .question {
            flex: 0 0 auto;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            text-align: center;
        }

        /* Feedback */
        .feedback {
            flex: 0 0 auto;
            padding: 10px 14px;
            border-radius: 14px;
            font-weight: 600;
            text-align: center;
            display: none;
            font-size: 15px;
        }

        .feedback.show {
            display: block;
            animation: kdRiseIn 0.35s ease both;
        }

        .feedback.correct {
            background: #d1fae5;
            color: #065f46;
        }

        .feedback.incorrect {
            background: #fee2e2;
            color: #991b1b;
        }

        /* Submit / Exit, pinned to the bottom of the left panel */
        .panel-actions {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
            padding-top: 14px;
        }

        .panel-actions .btn {
            width: 100%;
            padding: 15px 20px;
            font-size: 15px;
        }

        /* Right Panel: sign-response video options, large and centered */
        .video-panel {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Options */
        .options-section {
            width: 100%;
            height: 100%;
            padding: 8px;
            background: rgba(255,255,255,0.95);
            border-radius: 22px;
            box-shadow: 0 14px 34px rgba(15,23,42,0.09);
            border: 1px solid rgba(148,163,184,0.14);
            display: flex;
            flex-direction: column;
            animation: kdRiseIn 0.55s ease both;
            animation-delay: .06s;
        }

        .options-section strong {
            flex: 0 0 auto;
            display: block;
            margin-bottom: 12px;
            color: #333;
        }

        .options {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            justify-content: center;
            gap: 16px;
            padding: 4px;
        }

        .option-btn {
            padding: 6px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex: 1 1 280px;
            max-width: 420px;
        }

        .sign-video {
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 10px;
            background: #000;
            display: block;
            object-fit: contain;
            object-position: center center;
        }

        .option-btn:hover {
            border-color: #2563eb;
            background: #f0f7ff;
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.18);
        }

        .option-btn.selected {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 12px 24px rgba(37,99,235,0.28);
        }

        .option-btn.selected div {
            color: white;
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 12px 26px;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: white;
            box-shadow: 0 10px 20px rgba(37,99,235,0.24);
        }

        .btn-primary:hover {
            box-shadow: 0 14px 26px rgba(37,99,235,0.32);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        .btn-back {
            background: #475569;
            color: white;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-back:hover {
            background: #334155;
        }

        @media (max-width: 1024px) {
            .choices-panel {
                flex-basis: 380px;
                padding: 16px 18px;
            }

            .game-columns {
                gap: 14px;
            }

            .options-section {
                padding: 8px;
            }

            .game-topbar {
                padding: 10px 16px;
            }

            .option-btn {
                flex-basis: 200px;
            }
        }

        @media (max-width: 768px) {
            html, body {
                height: auto;
            }

            body {
                overflow: visible;
            }

            .game-columns {
                flex-direction: column;
            }

            .video-panel {
                flex: 0 0 auto;
                min-height: 300px;
            }

            .choices-panel {
                flex-basis: auto;
                min-width: 0;
            }

            .choices-scroll {
                overflow-y: visible;
            }

            .options {
                overflow-y: visible;
            }

            .topbar-controls {
                width: 100%;
                justify-content: space-between;
            }
        }

        @media (max-width: 420px) {
            .score-section {
                gap: 6px;
            }

            .score-box {
                min-width: 0;
                padding: 6px 10px;
            }

            .option-btn {
                flex-basis: 100%;
            }
        }

        /* ---- Dark theme overrides ---- */
        :root[data-theme="dark"] body {
            background-color: var(--surface-page);
            color: var(--text-body);
        }

        :root[data-theme="dark"] .game-topbar,
        :root[data-theme="dark"] .choices-panel,
        :root[data-theme="dark"] .options-section {
            background: var(--surface-card);
            border-color: var(--surface-border);
        }

        :root[data-theme="dark"] .game-topbar h1 {
            color: var(--text-body);
        }

        :root[data-theme="dark"] .level-badge {
            background: rgba(37,99,235,0.18);
            color: #93c5fd;
        }

        :root[data-theme="dark"] .difficulty-btn {
            background: var(--input-bg);
            border-color: var(--input-border);
            color: var(--text-body);
        }

        :root[data-theme="dark"] .difficulty-btn.locked,
        :root[data-theme="dark"] .difficulty-btn:disabled {
            border-color: var(--surface-border);
            background: var(--surface-card-alt);
            color: var(--text-muted);
        }

        :root[data-theme="dark"] .score-box {
            background: var(--surface-card-alt);
            border-color: var(--surface-border);
        }

        :root[data-theme="dark"] .score-box .label {
            color: var(--text-muted-2);
        }

        :root[data-theme="dark"] .scenario-box {
            background: linear-gradient(135deg, rgba(37,99,235,0.14) 0%, rgba(124,58,237,0.12) 100%);
            border-left-color: #60a5fa;
        }

        :root[data-theme="dark"] .scenario-text,
        :root[data-theme="dark"] .question {
            color: var(--text-body);
        }

        :root[data-theme="dark"] .options-section strong {
            color: var(--text-body);
        }

        :root[data-theme="dark"] .option-btn {
            background: var(--surface-card-alt);
            border-color: var(--input-border);
            color: var(--text-body);
        }

        :root[data-theme="dark"] .option-btn:hover {
            background: rgba(37,99,235,0.14);
            border-color: #60a5fa;
        }

        :root[data-theme="dark"] .feedback.correct {
            background: rgba(16, 185, 129, 0.16);
            color: #6ee7b7;
        }

        :root[data-theme="dark"] .feedback.incorrect {
            background: rgba(239, 68, 68, 0.16);
            color: #fca5a5;
        }

        /* ============ SIDEBAR NAV (fits into the no-scroll game shell) ============ */
        .dashboard-layout {
            flex: 1;
            min-height: 0;
        }

        .dashboard-main {
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 0;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .dashboard-main {
                overflow: visible;
            }
        }

        /* ============ COMPACT NAVBAR ============ */
        .navbar {
            padding: 8px 22px !important;
            min-height: 52px !important;
        }

        /* ============ SIDEBAR LOGO ============ */
        .sidebar-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
        }

        .sidebar-logo-badge {
            width: 160px;
            height: 104px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 26px;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            box-shadow: 0 14px 28px rgba(37,99,235,0.32);
        }

        .sidebar-logo {
            width: 150px;
            height: 76px;
            object-fit: contain;
        }
    </style>
</head>

    <script>
        function awardGameProgress(points, progressDelta, completed) {
            if (window.KumpasGamePreview && window.KumpasGamePreview.active) return;
            if (!window.KumpasPortal || typeof window.KumpasPortal.recordProgress !== 'function') return;
            window.KumpasPortal.recordProgress({
                moduleId: 'lesson8',
                points,
                progressDelta,
                completed,
                practiceMinutes: 4,
                activityName: 'Scenario-Based Game',
                activityText: 'Completed a scenario response round',
                activityMeta: `+${points} points`,
                icon: '🎭'
            });
        }

        // Sign videos are loaded from the database (SignVideo table), populated
        // from the "Sign Language" media library. scope=games excludes videos
        // uploaded via the Admin "Sign Language Videos" manager, which are
        // meant for Text-to-Sign only.
        const SIGN_VIDEOS_API = `${KumpasGames.API_BASE}/sign-videos/?scope=games`;
        const { videoMimeType } = KumpasGames;
        // Total on-screen sign-response options per difficulty (each scenario's
        // own authored options are always shown in full; extras are added up
        // to this total, sourced from the whole sign-video library so it works
        // for both hardcoded and teacher-authored scenarios).
        const TOTAL_OPTIONS = { easy: 3, medium: 4, hard: 6 };

        let signVideoByKey = {};
        let signVideoWords = [];
        let allSignClips = [];

        async function loadSignVideos() {
            const response = await fetch(SIGN_VIDEOS_API);
            if (!response.ok) {
                throw new Error(`Failed to load sign videos (${response.status})`);
            }
            const items = await response.json();
            const map = {};
            items.forEach(item => {
                map[String(item.key || '').toLowerCase()] = item.video_url;
            });
            signVideoByKey = map;
            signVideoWords = items.map(item => item.word).filter(Boolean);
        }

        function clipByName(name, correct = false) {
            const video = signVideoByKey[name.toLowerCase()] || '';
            return { name, video, correct };
        }

        function normalizeClipName(value) {
            return String(value == null ? '' : value)
                .toLowerCase()
                .replace(/[^a-z0-9\s]/g, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        // Scenario content lives in the database (GameLevel/GameLevelItem for
        // game_key='scenario'), loaded below via KumpasGames.loadGameLevels
        // ('scenario'). allSignClips needs the full clip library to pad extra
        // decoy options for each authored scenario.
        function buildSignClipLibrary() {
            allSignClips = signVideoWords.map(word => clipByName(word));
        }

        // Difficulty controls the total number of sign-response options shown
        // (the scenario's own authored options are always included in full;
        // extras are padded up to TOTAL_OPTIONS from the full clip library).
        const engine = KumpasGames.createGameEngine({
            choiceCounts: TOTAL_OPTIONS,
            pointBase: { easy: 20, medium: 25, hard: 30 },
        });

        let activeScenarios = [];
        let currentIndex = 0;
        let answered = false;
        let advanceTimer = null;

        function updateLevelTag() {
            const levelTag = document.getElementById('randomLevelTag');
            const ofTotal = document.getElementById('levelOfTotal');
            if (levelTag) levelTag.textContent = `Level ${engine.currentLevelNumber()}`;
            if (ofTotal) {
                const totalLevels = engine.totalLevelsForDifficulty(engine.state.difficulty);
                ofTotal.textContent = totalLevels ? `of ${totalLevels}` : '';
            }
        }

        function setDifficulty(level, button) {
            if (!engine.canSelectDifficulty(level)) {
                alert('Please finish the previous difficulty before continuing.');
                return;
            }
            engine.setDifficulty(level, true);
            startLevel();
        }

        function startLevel(resetScore = false) {
            if (advanceTimer) {
                clearTimeout(advanceTimer);
                advanceTimer = null;
            }
            if (resetScore) {
                engine.state.score = 0;
                engine.state.correct = 0;
            }
            currentIndex = 0;
            activeScenarios = engine.buildQuestionsForCurrentLevel();
            engine.state.total = activeScenarios.length;
            engine.updateDifficultyButtons();
            updateScores();
            nextQuestion();
        }

        function nextQuestion() {
            if (currentIndex >= activeScenarios.length) {
                const result = engine.advance();
                if (result === 'next-level') {
                    startLevel(false);
                } else if (result === 'next-difficulty') {
                    const nextDifficulty = engine.state.difficulty === 'easy' ? 'medium' : 'hard';
                    KumpasGames.showCompletionModal({
                        title: '🎉 Difficulty Complete!',
                        message: `You finished all levels on ${engine.state.difficulty}. Moving on to ${nextDifficulty}.`,
                        continueLabel: `Starting ${nextDifficulty[0].toUpperCase()}${nextDifficulty.slice(1)}...`,
                        autoContinueAfterMs: 1400,
                        onContinue: () => {
                            engine.setDifficulty(nextDifficulty, false);
                            startLevel(false);
                        },
                    });
                } else {
                    KumpasGames.awardCertificateIfEarned('scenario');
                    KumpasGames.showCompletionModal({
                        title: '🏆 Game Complete!',
                        message: 'You completed every difficulty. Restarting at Easy so you can play again.',
                        continueLabel: 'Play Again',
                        onContinue: () => {
                            engine.setDifficulty('easy', true);
                            startLevel(false);
                        },
                    });
                }
                return;
            }

            answered = false;
            updateLevelTag();

            const scenario = activeScenarios[currentIndex];
            document.getElementById('scenario-text').textContent = scenario.scenario;
            document.getElementById('scenario-question').textContent = scenario.question;

            if (engine.state.difficulty === 'hard') {
                document.getElementById('scenario-question').style.display = 'none';
            } else {
                document.getElementById('scenario-question').style.display = 'block';
            }

            const optionsDiv = document.getElementById('options');
            KumpasGames.clearMediaContainer(optionsDiv);

            const totalWanted = engine.getChoiceCount();
            let opts = [...scenario.options];
            if (opts.length < totalWanted) {
                const usedNames = new Set(opts.map(item => item.name));
                const extras = KumpasGames.shuffle(
                    allSignClips.filter(item => !usedNames.has(item.name))
                )
                    .slice(0, totalWanted - opts.length)
                    .map(item => ({ ...item, correct: false }));

                opts.push(...extras);
                opts = KumpasGames.shuffle(opts);
            }

            opts.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.dataset.correct = opt.correct;
                btn.appendChild(KumpasGames.buildVideoElement(opt.video));
                btn.onclick = () => selectOption(btn);
                optionsDiv.appendChild(btn);
            });

            clearFeedback();
        }

        function selectOption(btn) {
            document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function submitAnswer() {
            if (answered) return;

            const selected = document.querySelector('.option-btn.selected');
            const feedbackDiv = document.getElementById('feedback');

            if (!selected) {
                alert('Please select a sign response!');
                return;
            }

            answered = true;
            document.querySelectorAll('.option-btn').forEach(btn => btn.style.pointerEvents = 'none');

            const isCorrect = normalizeClipName(selected.dataset.correct) === 'true';

            if (isCorrect) {
                const points = engine.getPointValue();
                engine.state.correct++;
                engine.state.score += points;
                feedbackDiv.classList.remove('incorrect');
                feedbackDiv.classList.add('correct', 'show');
                feedbackDiv.textContent = '✓ Correct! You chose the right sign language response!';
                awardGameProgress(points, 15, currentIndex + 1 >= activeScenarios.length && !engine.hasNextLevel());
            } else {
                feedbackDiv.classList.remove('correct');
                feedbackDiv.classList.add('incorrect', 'show');
                feedbackDiv.textContent = '✗ Incorrect. That is not the appropriate sign language for this scenario.';
            }

            updateScores();
            if (advanceTimer) clearTimeout(advanceTimer);
            advanceTimer = setTimeout(() => {
                advanceTimer = null;
                currentIndex++;
                nextQuestion();
            }, 1400);
        }

        function updateScores() {
            document.getElementById('score').textContent = engine.state.score;
            document.getElementById('correct').textContent = engine.state.correct;
            document.getElementById('total').textContent = engine.state.total;
        }

        function clearFeedback() {
            const feedbackDiv = document.getElementById('feedback');
            feedbackDiv.classList.remove('show', 'correct', 'incorrect');
        }

        function getActivePool() { return engine.getActivePool(); }
        function canSelectDifficulty(level) { return engine.canSelectDifficulty(level); }
        function switchDifficulty(level, resetScore = true) {
            engine.setDifficulty(level, resetScore);
            startLevel(false);
        }

        function mapScenarioItem(item) {
            const extra = item.extra_data || {};
            if (!item.prompt || !Array.isArray(extra.options) || extra.options.length < 2 || !extra.options.some(opt => opt.correct)) return null;
            return {
                scenario: item.prompt,
                question: extra.question || '',
                options: extra.options,
            };
        }

        // Initialize game
        Promise.all([
            loadSignVideos().then(() => buildSignClipLibrary()),
            KumpasGames.loadGameLevels('scenario').then(levels => {
                engine.state.levelsByDifficulty = KumpasGames.buildLevelsByDifficulty(levels, mapScenarioItem);
            }),
        ])
            .then(() => {
                const levelCounts = {
                    easy: engine.totalLevelsForDifficulty('easy') || 0,
                    medium: engine.totalLevelsForDifficulty('medium') || 0,
                    hard: engine.totalLevelsForDifficulty('hard') || 0,
                };
                KumpasGames.initInstructionsModal({
                    title: 'Scenario-Based Game',
                    icon: '🎭',
                    objective: 'Read a real-life scenario and choose the sign-language response that fits it best.',
                    howToPlay: [
                        'Read the scenario and (on Easy/Medium) the guiding question.',
                        'Watch each sign-response video option and pick the one that best fits the situation.',
                        'Click "Check Response" to see if you were right — the game moves to the next scenario automatically.',
                        'On Hard difficulty, the guiding question is hidden and more answer choices are shown.',
                    ],
                    scoring: [
                        'Correct responses earn points based on your difficulty and current level.',
                        'Harder difficulties and higher levels are worth more points.',
                    ],
                    levelCounts,
                    onStart: () => startLevel(true),
                });
            })
            .catch(err => {
                console.error('Failed to load sign videos:', err);
                document.getElementById('options').innerHTML = '<p style="color:#991b1b;">Unable to load sign videos. Please refresh the page.</p>';
            });
    </script>
</body>
</html>
