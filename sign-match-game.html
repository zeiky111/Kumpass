<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Match Game - Kumpas</title>
    <link rel="stylesheet" href="css/style.css?v=20260801">
    <link rel="stylesheet" href="css/dashboard.css?v=20260801">
    <link rel="stylesheet" href="css/bg-orbs.css?v=20260801">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="js/theme.js?v=20260801"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #eff6ff;
            color: #1f2937;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1, h2, h3 {
            font-family: 'Poppins', 'Inter', sans-serif;
        }


        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            padding: clamp(0.75rem, 2vw, 1.25rem) clamp(1rem, 3vw, 1.5rem);
        }

        /* Fills the remaining viewport height below the navbar */
        .game-shell {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            gap: 14px;
        }

        /* Top Bar: title, level, difficulty, score */
        .game-topbar {
            flex: 0 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px 24px;
            background: rgba(255,255,255,0.95);
            border-radius: 18px;
            padding: 12px 20px;
            box-shadow: 0 10px 24px rgba(15,23,42,0.08);
            border: 1px solid rgba(148,163,184,0.14);
        }

        .topbar-title-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .game-topbar h1 {
            font-size: clamp(1.05rem, 1.6vw + 0.7rem, 1.4rem);
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.02em;
        }

        .level-badge {
            font-size: 12px;
            font-weight: 700;
            color: #2563eb;
            background: #eef2ff;
            padding: 5px 12px;
            border-radius: 999px;
            white-space: nowrap;
            letter-spacing: 0.01em;
        }

        .topbar-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 20px;
        }

        /* Difficulty Selector */
        .difficulty-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .difficulty-btn {
            padding: 8px 14px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.25s;
        }

        .difficulty-btn:hover {
            border-color: #2563eb;
            color: #2563eb;
        }

        .difficulty-btn.selected {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 10px 20px rgba(37,99,235,0.24);
        }

        .difficulty-btn.locked,
        .difficulty-btn:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            border-color: #ccc;
            background: #f9f9f9;
            color: #777;
        }

        /* Score Section */
        .score-section {
            display: flex;
            gap: 10px;
        }

        .score-box {
            background: #f8fafc;
            border: 1px solid rgba(148,163,184,0.14);
            padding: 6px 14px;
            border-radius: 12px;
            text-align: center;
            min-width: 64px;
            transition: transform 0.2s ease;
        }

        .score-box:hover {
            transform: translateY(-2px);
        }

        .score-box .label {
            font-size: 10px;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .score-box .value {
            font-size: 17px;
            font-weight: 700;
            color: #2563eb;
        }

        /* Game Columns: choices on the left, video on the right */
        .game-columns {
            flex: 1;
            display: flex;
            gap: 20px;
            min-height: 0;
        }

        /* Left Panel: answer choices + actions */
        .choices-panel {
            flex: 0 1 400px;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: rgba(255,255,255,0.95);
            border-radius: 22px;
            padding: 20px 22px;
            box-shadow: 0 14px 34px rgba(15,23,42,0.09);
            border: 1px solid rgba(148,163,184,0.14);
            animation: kdRiseIn 0.55s ease both;
        }

        .question {
            flex: 0 0 auto;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #0f172a;
        }

        .options {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            align-content: start;
            gap: 10px;
            padding-right: 2px;
        }

        .option-btn {
            padding: 12px;
            border: 2px solid #e2e8f0;
            background: white;
            border-radius: 14px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.25s;
            text-align: left;
            font-weight: 600;
        }

        .option-btn:hover {
            border-color: #2563eb;
            background: #f0f7ff;
            transform: translateY(-2px);
        }

        .option-btn.selected {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: white;
            border-color: transparent;
            box-shadow: 0 10px 20px rgba(37,99,235,0.24);
        }

        /* Feedback */
        .feedback {
            flex: 0 0 auto;
            padding: 10px 14px;
            border-radius: 14px;
            margin-top: 10px;
            font-weight: 600;
            text-align: center;
            display: none;
            font-size: 15px;
        }

        .feedback.show {
            display: block;
            animation: kdRiseIn 0.35s ease both;
        }

        .feedback.correct {
            background: #d1fae5;
            color: #065f46;
        }

        .feedback.incorrect {
            background: #fee2e2;
            color: #991b1b;
        }

        /* Submit / Exit, pinned to the bottom of the left panel */
        .panel-actions {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
            padding-top: 14px;
        }

        .panel-actions .btn {
            width: 100%;
            padding: 15px 20px;
            font-size: 15px;
        }

        /* Right Panel: sign video, large and vertically centered */
        .video-panel {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sign-display {
            width: 100%;
            height: 100%;
            padding: 8px;
            background: rgba(255,255,255,0.95);
            border-radius: 22px;
            box-shadow: 0 14px 34px rgba(15,23,42,0.09);
            border: 1px solid rgba(148,163,184,0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: kdRiseIn 0.55s ease both;
            animation-delay: .06s;
        }

        .sign-video {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 14px;
            background: #000;
            display: block;
            object-fit: contain;
            object-position: center center;
            box-shadow: 0 12px 28px rgba(15,23,42,0.14);
        }

        /* Buttons */
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 12px 26px;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            color: white;
            box-shadow: 0 10px 20px rgba(37,99,235,0.24);
        }

        .btn-primary:hover {
            box-shadow: 0 14px 26px rgba(37,99,235,0.32);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: #334155;
        }

        .btn-secondary:hover {
            background: #cbd5e1;
        }

        .btn-back {
            background: #475569;
            color: white;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-back:hover {
            background: #334155;
        }

        @media (max-width: 1024px) {
            .choices-panel {
                flex-basis: 340px;
                padding: 16px 18px;
            }

            .game-columns {
                gap: 14px;
            }

            .sign-display {
                padding: 8px;
            }

            .game-topbar {
                padding: 10px 16px;
            }
        }

        @media (max-width: 768px) {
            html, body {
                height: auto;
            }

            body {
                overflow: visible;
            }

            .game-columns {
                flex-direction: column;
            }

            .video-panel {
                flex: 0 0 auto;
                min-height: 240px;
            }

            .choices-panel {
                flex-basis: auto;
                min-width: 0;
            }

            .options {
                overflow-y: visible;
            }

            .topbar-controls {
                width: 100%;
                justify-content: space-between;
            }
        }

        @media (max-width: 420px) {
            .options {
                grid-template-columns: 1fr;
            }

            .score-section {
                gap: 6px;
            }

            .score-box {
                min-width: 0;
                padding: 6px 10px;
            }
        }

        /* ---- Dark theme overrides ---- */
        :root[data-theme="dark"] .game-topbar,
        :root[data-theme="dark"] .choices-panel,
        :root[data-theme="dark"] .sign-display {
            background: var(--surface-card);
            border-color: var(--surface-border);
        }

        :root[data-theme="dark"] .game-topbar h1 {
            color: var(--text-body);
        }

        :root[data-theme="dark"] .level-badge {
            background: rgba(37,99,235,0.18);
            color: #93c5fd;
        }

        :root[data-theme="dark"] .difficulty-btn {
            background: var(--input-bg);
            border-color: var(--input-border);
            color: var(--text-body);
        }

        :root[data-theme="dark"] .difficulty-btn.locked,
        :root[data-theme="dark"] .difficulty-btn:disabled {
            background: var(--surface-card-alt);
            border-color: var(--surface-border);
            color: var(--text-muted);
        }

        :root[data-theme="dark"] .score-box {
            background: var(--surface-card-alt);
            border-color: var(--surface-border);
        }

        :root[data-theme="dark"] .score-box .label {
            color: var(--text-muted-2);
        }

        :root[data-theme="dark"] .question {
            color: var(--text-body);
        }

        :root[data-theme="dark"] .option-btn {
            background: var(--input-bg);
            border-color: var(--input-border);
            color: var(--text-body);
        }

        :root[data-theme="dark"] .option-btn:hover {
            background: rgba(37,99,235,0.16);
        }

        :root[data-theme="dark"] .feedback.correct {
            background: rgba(16, 185, 129, 0.16);
            color: #6ee7b7;
        }

        :root[data-theme="dark"] .feedback.incorrect {
            background: rgba(239, 68, 68, 0.16);
            color: #fca5a5;
        }

        :root[data-theme="dark"] .btn-secondary {
            background: #232e45;
            color: var(--text-body);
        }

        :root[data-theme="dark"] .btn-secondary:hover {
            background: #2a3448;
        }

        /* ============ SIDEBAR NAV (fits into the no-scroll game shell) ============ */
        .dashboard-layout {
            flex: 1;
            min-height: 0;
        }

        .dashboard-main {
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 0;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .dashboard-main {
                overflow: visible;
            }
        }

        /* ============ COMPACT NAVBAR ============ */
        .navbar {
            padding: 8px 22px !important;
            min-height: 52px !important;
        }

        /* ============ SIDEBAR LOGO ============ */
        .sidebar-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
        }

        .sidebar-logo-badge {
            width: 160px;
            height: 104px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 26px;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            box-shadow: 0 14px 28px rgba(37,99,235,0.32);
        }

        .sidebar-logo {
            width: 150px;
            height: 76px;
            object-fit: contain;
        }
    </style>
</head>

    <script>
        function awardGameProgress(points, progressDelta, completed) {
            if (window.KumpasGamePreview && window.KumpasGamePreview.active) return;
            if (!window.KumpasPortal || typeof window.KumpasPortal.recordProgress !== 'function') return;
            window.KumpasPortal.recordProgress({
                moduleId: 'lesson2',
                points,
                progressDelta,
                completed,
                practiceMinutes: 2,
                activityName: 'Sign Match Game',
                activityText: 'Completed a sign match round',
                activityMeta: `+${points} points`,
                icon: '🎯'
            });
        }

        // Sign videos are loaded from the database (SignVideo table) purely to
        // pad multiple-choice distractors -- each level itself now holds a
        // single word, so wrong-answer options must come from the wider
        // library, not from the level's own (empty-after-filtering) pool.
        const SIGN_VIDEOS_API = `${KumpasGames.API_BASE}/sign-videos/?scope=games`;
        const { videoMimeType } = KumpasGames;

        let allWordLabels = [];

        async function loadDistractorWords() {
            const response = await fetch(SIGN_VIDEOS_API);
            if (!response.ok) throw new Error(`Failed to load sign videos (${response.status})`);
            const items = await response.json();
            allWordLabels = items.map(item => item.word).filter(Boolean);
        }

        // Difficulty only changes the number of multiple-choice options shown.
        const engine = KumpasGames.createGameEngine({
            choiceCounts: { easy: 4, medium: 6, hard: 8 },
            pointBase: { easy: 10, medium: 14, hard: 18 },
        });

        let activeQuestions = [];
        let currentIndex = 0;
        let answered = false;
        let advanceTimer = null;

        function updateLevelTag() {
            const levelTag = document.getElementById('randomLevelTag');
            const ofTotal = document.getElementById('levelOfTotal');
            if (levelTag) levelTag.textContent = `Level ${engine.currentLevelNumber()}`;
            if (ofTotal) {
                const totalLevels = engine.totalLevelsForDifficulty(engine.state.difficulty);
                ofTotal.textContent = totalLevels ? `of ${totalLevels}` : '';
            }
            const progressBadge = document.getElementById('questionProgressBadge');
            if (progressBadge) {
                progressBadge.textContent = activeQuestions.length
                    ? `Question ${Math.min(currentIndex + 1, activeQuestions.length)} of ${activeQuestions.length}`
                    : '';
            }
        }

        function buildOptions(question) {
            const count = engine.getChoiceCount();
            const otherLabels = allWordLabels
                .filter(label => engine.normalizeText(label) !== engine.normalizeText(question.label));

            const distractors = engine.shuffle(otherLabels).slice(0, Math.max(1, count - 1));
            const base = [question.label, ...distractors];
            return engine.shuffle(base);
        }

        function setDifficulty(level, button) {
            if (!engine.canSelectDifficulty(level)) {
                alert('Please finish the previous difficulty before continuing.');
                return;
            }
            engine.setDifficulty(level, true);
            startLevel();
        }

        function startLevel(resetScore = false) {
            if (advanceTimer) {
                clearTimeout(advanceTimer);
                advanceTimer = null;
            }
            if (resetScore) {
                engine.state.score = 0;
                engine.state.correct = 0;
            }
            currentIndex = 0;
            activeQuestions = engine.buildQuestionsForCurrentLevel();
            engine.state.total = activeQuestions.length;
            engine.updateDifficultyButtons();
            updateScores();
            nextQuestion();
        }

        function nextQuestion() {
            if (currentIndex >= activeQuestions.length) {
                const result = engine.advance();
                if (result === 'next-level') {
                    startLevel(false);
                } else if (result === 'next-difficulty') {
                    const nextDifficulty = engine.state.difficulty === 'easy' ? 'medium' : 'hard';
                    KumpasGames.showCompletionModal({
                        title: '🎉 Difficulty Complete!',
                        message: `You finished all levels on ${engine.state.difficulty}. Moving on to ${nextDifficulty}.`,
                        continueLabel: `Starting ${nextDifficulty[0].toUpperCase()}${nextDifficulty.slice(1)}...`,
                        autoContinueAfterMs: 1400,
                        onContinue: () => {
                            engine.setDifficulty(nextDifficulty, false);
                            startLevel(false);
                        },
                    });
                } else {
                    KumpasGames.awardCertificateIfEarned('sign_match');
                    KumpasGames.showCompletionModal({
                        title: '🏆 Game Complete!',
                        message: 'You completed every difficulty. Restarting at Easy so you can play again.',
                        continueLabel: 'Play Again',
                        onContinue: () => {
                            engine.setDifficulty('easy', true);
                            startLevel(false);
                        },
                    });
                }
                return;
            }

            answered = false;
            updateLevelTag();

            const question = activeQuestions[currentIndex];
            KumpasGames.replaceVideoContent(document.getElementById('sign'), question.video);

            const optionsDiv = document.getElementById('options');
            KumpasGames.clearMediaContainer(optionsDiv);

            const opts = buildOptions(question);

            opts.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.type = 'button';
                btn.textContent = opt;
                btn.onclick = () => selectOption(opt, btn);
                optionsDiv.appendChild(btn);
            });

            document.getElementById('feedback').classList.remove('show', 'correct', 'incorrect');
            document.getElementById('feedback').textContent = '';
            clearFeedback();
        }

        function selectOption(option, button) {
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            if (button) button.classList.add('selected');
        }

        function submitAnswer() {
            if (answered) return;

            const question = activeQuestions[currentIndex];
            const selected = document.querySelector('.option-btn.selected');
            const feedbackDiv = document.getElementById('feedback');

            if (!selected) {
                alert('Please select an answer!');
                return;
            }

            answered = true;
            document.querySelectorAll('.option-btn').forEach(btn => btn.style.pointerEvents = 'none');

            const isCorrect = engine.normalizeText(selected.textContent) === engine.normalizeText(question.label);

            if (isCorrect) {
                const points = engine.getPointValue();
                engine.state.correct++;
                engine.state.score += points;
                feedbackDiv.classList.remove('incorrect');
                feedbackDiv.classList.add('correct', 'show');
                feedbackDiv.textContent = '✓ Correct! Great job!';
                awardGameProgress(points, 10, currentIndex + 1 >= activeQuestions.length && !engine.hasNextLevel());
            } else {
                feedbackDiv.classList.remove('correct');
                feedbackDiv.classList.add('incorrect', 'show');
                feedbackDiv.textContent = `✗ Incorrect. The correct answer is: ${question.label}`;
            }

            updateScores();

            if (advanceTimer) clearTimeout(advanceTimer);
            advanceTimer = setTimeout(() => {
                advanceTimer = null;
                currentIndex += 1;
                nextQuestion();
            }, 900);
        }

        function updateScores() {
            document.getElementById('score').textContent = engine.state.score;
            document.getElementById('correct').textContent = engine.state.correct;
            document.getElementById('total').textContent = engine.state.total;
        }

        function clearFeedback() {
            const feedbackDiv = document.getElementById('feedback');
            feedbackDiv.classList.remove('show', 'correct', 'incorrect');
        }

        function getActivePool() { return engine.getActivePool(); }
        function canSelectDifficulty(level) { return engine.canSelectDifficulty(level); }
        function switchDifficulty(level, resetScore = true) {
            engine.setDifficulty(level, resetScore);
            startLevel(false);
        }

        // Initialize game
        Promise.all([
            loadDistractorWords(),
            KumpasGames.loadGameLevels('sign_match').then(levels => {
                engine.state.levelsByDifficulty = KumpasGames.buildLevelsByDifficulty(
                    levels,
                    item => (item.prompt && item.media_url) ? { label: item.prompt, video: item.media_url } : null
                );
            }),
        ])
            .then(() => {
                const levelCounts = {
                    easy: engine.totalLevelsForDifficulty('easy') || 0,
                    medium: engine.totalLevelsForDifficulty('medium') || 0,
                    hard: engine.totalLevelsForDifficulty('hard') || 0,
                };
                KumpasGames.initInstructionsModal({
                    title: 'Sign Match Game',
                    icon: '🎯',
                    objective: 'Watch a sign-language video and pick the word that matches its meaning.',
                    howToPlay: [
                        'A short sign-language video plays for each question.',
                        'Choose the word you think matches the sign from the options shown.',
                        'Click "Submit Answer" to check your choice, then move to the next question.',
                    ],
                    scoring: [
                        'Correct answers earn points based on your difficulty and current level.',
                        'Harder difficulties and higher levels are worth more points.',
                    ],
                    levelCounts,
                    onStart: () => startLevel(true),
                });
            })
            .catch(err => {
                console.error('Failed to load game levels:', err);
                document.getElementById('sign').innerHTML = '<p style="color:#991b1b;">Unable to load game levels. Please refresh the page.</p>';
            });
    </script>
</body>
</html>
