<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activities - Kumpas</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/pages.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/bg-orbs.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="js/theme.js"></script>
    <style>
        :root {
            --gradient-primary: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            --gradient-secondary: linear-gradient(135deg, #0d9488 0%, #10b981 100%);
            --gradient-warm: linear-gradient(135deg, #f97316 0%, #ec4899 100%);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: #1f2937;
        }
        h1, h2, h3 {
            font-family: 'Poppins', 'Inter', sans-serif;
        }

        .dashboard-layout {
            background: transparent;
        }
        .container-fluid {
            max-width: 1400px;
            margin: 0 auto;
            padding: clamp(1.25rem, 3.5vw, 2rem) clamp(1rem, 3vw, 1.5rem) clamp(2rem, 5vw, 3.5rem);
        }

        /* ============ PAGE HEADER ============ */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 28px;
            padding: 26px 30px;
            border-bottom: none;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 28px rgba(15,23,42,0.07);
            border: 1px solid rgba(148,163,184,0.14);
        }
        .page-header h1 {
            font-size: 1.7rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .page-header h1::before {
            content: '\f5fc';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: var(--gradient-primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            flex-shrink: 0;
            box-shadow: 0 8px 18px rgba(37,99,235,0.28);
            animation: actIconPulse 2.6s ease-in-out infinite;
        }
        .page-header p {
            color: #64748b;
            font-size: 0.92rem;
        }

        /* ============ BUTTONS ============ */
        .btn {
            padding: 11px 22px;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-size: 14px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover { transform: translateY(-1px) scale(1.03); }
        .btn-primary {
            background: var(--gradient-primary);
            color: white;
            box-shadow: 0 10px 20px rgba(37,99,235,0.24);
        }
        .btn-primary:hover {
            box-shadow: 0 14px 26px rgba(37,99,235,0.32);
        }
        .btn-secondary {
            background: #eef2ff;
            color: #2563eb;
        }
        .btn-secondary:hover {
            background: #e0e7ff;
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 12px;
        }

        /* ============ SECTION HEADER ============ */
        .section-header {
            margin-bottom: 22px;
        }
        .section-header h2 {
            font-size: 1.35rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .section-header p {
            color: #64748b;
            font-size: 14px;
        }

        /* ============ GRID / CARDS ============ */
        .grid {
            display: grid;
            gap: 20px;
        }
        .grid-3 {
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        }
        .card {
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 24px rgba(15,23,42,0.07);
            border: 1px solid rgba(148,163,184,0.12);
            transition: all 0.28s ease;
        }
        .card:hover {
            box-shadow: 0 20px 36px rgba(15,23,42,0.13);
            transform: translateY(-5px);
        }
        .activity-card {
            padding: 22px;
            display: flex;
            flex-direction: column;
        }
        .activity-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }
        .activity-icon {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            box-shadow: 0 8px 18px rgba(37,99,235,0.22);
            transition: transform 0.35s ease;
        }
        .activity-card:hover .activity-icon {
            transform: rotate(-6deg) scale(1.08);
        }
        .difficulty-badge {
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }
        .difficulty-badge.easy {
            background: #d1fae5;
            color: #065f46;
        }
        .difficulty-badge.medium {
            background: #fef3c7;
            color: #92400e;
        }
        .difficulty-badge.hard {
            background: #fee2e2;
            color: #991b1b;
        }
        .activity-title {
            font-family: 'Poppins', 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 8px;
        }
        .activity-description {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 14px;
            line-height: 1.55;
        }
        .activity-meta {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            font-size: 12px;
            color: #94a3b8;
            flex-wrap: wrap;
        }
        .activity-meta span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .activity-progress {
            margin-bottom: 16px;
        }
        .progress {
            height: 7px;
            background: #eef2f7;
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            border-radius: 999px;
            background-image: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent), var(--gradient-primary);
            background-size: 60px 100%, 100% 100%;
            background-repeat: no-repeat;
            background-position: -60px 0, 0 0;
            transition: width 0.6s ease;
            animation: actShimmer 2.2s ease-in-out infinite;
        }
        .progress-text {
            font-size: 11px;
            color: #059669;
            font-weight: 700;
            display: block;
            margin-top: 6px;
        }
        .activity-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid #f1f5f9;
        }
        .activity-score {
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
        }

        /* ============ QUICK PRACTICE TOOLS ============ */
        .quick-actions-section {
            margin-top: 44px;
        }
        .quick-actions-section h2 {
            font-size: 1.35rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 18px;
        }
        .quick-action-card {
            padding: 24px;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            position: relative;
        }
        .quick-action-card:hover {
            text-decoration: none;
        }
        .quick-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
            margin-bottom: 16px;
            box-shadow: 0 10px 20px rgba(37,99,235,0.22);
            transition: transform 0.35s ease;
        }
        .quick-action-card:hover .quick-icon {
            transform: rotate(-6deg) scale(1.08);
        }
        .quick-action-card h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }
        .quick-action-card p {
            font-size: 13px;
            color: #64748b;
            line-height: 1.55;
        }
        .quick-action-card::after {
            content: '\f061';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: 24px;
            right: 22px;
            color: #cbd5e1;
            font-size: 14px;
            transition: transform 0.25s ease, color 0.25s ease;
        }
        .quick-action-card:hover::after {
            color: #2563eb;
            transform: translateX(4px);
        }

        /* ============ ANIMATIONS ============ */
        @keyframes actRiseIn {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes actIconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        @keyframes actShimmer {
            0% { background-position: -60px 0, 0 0; }
            100% { background-position: 220px 0, 0 0; }
        }

        .page-header,
        #activitiesPageContent > * {
            animation: actRiseIn 0.6s cubic-bezier(.16,1,.3,1) both;
        }
        .page-header { animation-delay: 0s; }
        #activitiesPageContent > *:nth-child(1) { animation-delay: .08s; }
        #activitiesPageContent > *:nth-child(2) { animation-delay: .16s; }
        #activitiesPageContent > *:nth-child(3) { animation-delay: .24s; }

        .activity-card,
        .quick-action-card {
            animation: actRiseIn 0.5s ease both;
        }
        .activities-grid > *:nth-child(1),
        .quick-actions > *:nth-child(1) { animation-delay: .05s; }
        .activities-grid > *:nth-child(2),
        .quick-actions > *:nth-child(2) { animation-delay: .11s; }
        .activities-grid > *:nth-child(3) { animation-delay: .17s; }
        .activities-grid > *:nth-child(4) { animation-delay: .23s; }
        .activities-grid > *:nth-child(5) { animation-delay: .29s; }
        .activities-grid > *:nth-child(6) { animation-delay: .35s; }

        @media (prefers-reduced-motion: reduce) {
            body,
            .bg-orbs span,
            .page-header,
            #activitiesPageContent > *,
            .activity-card,
            .quick-action-card,
            .page-header h1::before,
            .progress-bar {
                animation: none !important;
            }
        }

        @media (max-width: 1024px) {
            .page-header { padding: 22px 24px; }
        }

        @media (max-width: 768px) {
            .page-header { flex-direction: column; align-items: flex-start; }
        }

        /* Dark theme overrides for this page's own surfaces */
        :root[data-theme="dark"] body {
            color: var(--text-body);
        }

        :root[data-theme="dark"] .page-header {
            background: var(--surface-card);
            border-color: var(--surface-border);
        }

        :root[data-theme="dark"] .page-header h1,
        :root[data-theme="dark"] .section-header h2,
        :root[data-theme="dark"] .activity-title,
        :root[data-theme="dark"] .quick-action-card h3 {
            color: var(--text-body);
        }

        :root[data-theme="dark"] .page-header p,
        :root[data-theme="dark"] .section-header p,
        :root[data-theme="dark"] .activity-description,
        :root[data-theme="dark"] .activity-score,
        :root[data-theme="dark"] .quick-action-card p {
            color: var(--text-muted-2);
        }

        :root[data-theme="dark"] .btn-secondary {
            background: var(--surface-card-alt);
            color: #93c5fd;
        }

        :root[data-theme="dark"] .btn-secondary:hover {
            background: var(--surface-border);
        }

        :root[data-theme="dark"] .card,
        :root[data-theme="dark"] .activity-card,
        :root[data-theme="dark"] .quick-action-card {
            background: var(--surface-card);
            border-color: var(--surface-border);
        }

        :root[data-theme="dark"] .difficulty-badge.easy {
            background: rgba(16, 185, 129, 0.16);
            color: #6ee7b7;
        }

        :root[data-theme="dark"] .difficulty-badge.medium {
            background: rgba(245, 158, 11, 0.18);
            color: #fcd34d;
        }

        :root[data-theme="dark"] .difficulty-badge.hard {
            background: rgba(239, 68, 68, 0.18);
            color: #fca5a5;
        }

        :root[data-theme="dark"] .activity-meta {
            color: var(--text-muted-2);
        }

        :root[data-theme="dark"] .progress {
            background: var(--surface-card-alt);
        }

        :root[data-theme="dark"] .activity-actions {
            border-top-color: var(--surface-border);
        }

        :root[data-theme="dark"] .quick-action-card::after {
            color: var(--text-muted-2);
        }

        :root[data-theme="dark"] .quick-action-card:hover::after {
            color: #93c5fd;
        }

        /* ============ COMPACT NAVBAR ============ */
        .navbar {
            padding: 8px 22px !important;
            min-height: 52px !important;
        }

        /* ============ SIDEBAR LOGO ============ */
        .sidebar-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-align: center;
        }

        .sidebar-logo-badge {
            width: 160px;
            height: 104px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 26px;
            background: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
            box-shadow: 0 14px 28px rgba(37,99,235,0.32);
        }

        .sidebar-logo {
            width: 150px;
            height: 76px;
            object-fit: contain;
        }
    </style>
</head>
<body class="kd-animated-bg">
    <div class="bg-orbs" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>
    <script src="js/auth.js"></script>
    <script>
        requireAuth();
    </script>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container navbar-container">
            <a href="dashboard.html" class="logo">
                <span>Activities</span>
            </a>
            <div class="nav-user-menu" id="navUserMenu">
                <button class="nav-user-toggle" id="navUserToggle">
                    <i class="fas fa-user-circle"></i>
                </button>
                <div class="nav-user-dropdown" id="navUserDropdown">
                    <a href="profile.html"><i class="fas fa-user"></i> Profile</a>
                    <a href="index.html" class="logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Activities Content -->
    <div class="dashboard-layout">
        <aside class="dashboard-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo-badge">
                    <img src="images/kumpas_logo.png" alt="Kumpas Logo" class="sidebar-logo">
                </div>
            </div>
            <ul class="sidebar-menu">
                <li><a href="dashboard.html" class="sidebar-link"><i class="fas fa-gauge"></i> Dashboard</a></li>
                <li><a href="learning.html" class="sidebar-link"><i class="fas fa-book-open"></i> Learn</a></li>
                <li><a href="activities.html" class="sidebar-link active"><i class="fas fa-list-check"></i> Activities</a></li>
                <li><a href="translator.html" class="sidebar-link"><i class="fas fa-language"></i> Translators</a></li>
                <li><a href="leaderboard.html" class="sidebar-link"><i class="fas fa-trophy"></i> Leaderboard</a></li>
            </ul>
        </aside>
        <main class="dashboard-main">
            <div class="container-fluid">
                <!-- Page Header -->
                <div class="page-header">
                    <div>
                        <h1 id="activitiesPageTitle"></h1>
                        <p id="activitiesPageSubtitle"></p>
                    </div>
                </div>

                <div id="activitiesPageContent"></div>
            </div>
        </main>
    </div>

    <script src="js/main.js"></script>
    <script src="js/portal.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (window.KumpasPortal && typeof window.KumpasPortal.applyYearAccessRules === 'function') {
                window.KumpasPortal.applyYearAccessRules();
            }
            // Navbar dropdown
            const _navToggle = document.getElementById('navUserToggle');
            const _navDrop = document.getElementById('navUserDropdown');
            if (_navToggle && _navDrop) {
                _navToggle.addEventListener('click', function(e) { e.stopPropagation(); _navDrop.classList.toggle('open'); });
                document.addEventListener('click', function() { _navDrop.classList.remove('open'); });
            }
        });
    </script>
</body>
</html>
